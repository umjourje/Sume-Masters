[project]
name = "wlstmix-fed-anomaly"
version = "0.1.0"
# duckdb REMOVIDO: confirmado que nem client_app nem server_app o
# importam (é usado só nos passos 1-3 de preparação de dados, na
# máquina grande — não precisa estar instalado nos Raspberries).
# tensorboard: exigido apenas no SERVIDOR (TensorBoardFedAvg); nos Pis
# o pacote nunca é importado — se instalar via extras por dispositivo,
# pode omiti-lo nos clientes sem efeito algum.
dependencies = ["flwr>=1.21", "torch", "numpy", "pandas", "scikit-learn",
                "pywavelets", "tensorboard", "python-dotenv"]

[tool.flwr.app]
publisher = "tupa"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1
local-epochs = 1
lr = 0.001
v0-path = ""
# ---- NOVO (smoke test + observabilidade) ----
# tag: identifica o run; nomeia loss_<tag>.jsonl, summary_<tag>.json,
#      confusion_matrix_<tag>.json (Pis) e run_summary_<tag>.json (servidor).
tag = "default"
# max-shards: 0 = treino completo; N>0 = amostra uniformemente espaçada
#      de N shards por cliente (uso: smoke test, ex. max-shards=2).
max-shards = 15
max-windows = 0
# metrics-dir NÃO fica aqui: é por dispositivo, declarado no node-config
# de cada SuperNode:
#   flower-supernode ... --node-config \
#     "data-root='/dados/particao_X' metrics-dir='/home/pi/tupa_metrics'"

[tool.flwr.federations]
default = "local-sim"

# Ensaio local: 5 supernós simulados (mesmo nº dos 5 Raspberries reais),
# cada um podendo já apontar para uma pasta de partição diferente via
# node-config, para validar o fluxo INTEIRO antes de tocar nos Pis.
[tool.flwr.federations.local-sim]
options.num-supernodes = 5

# Implantação real, SEM TLS (rede local fechada e controlada — decisão
# explícita; TLS fica para trabalho futuro, não muda os resultados numa
# rede confiável). ⚠️ NÃO EXECUTADO/VERIFICADO neste ambiente: confirme
# a chave exata para modo inseguro contra `flwr run --help` e a versão
# instalada do Flower — em algumas versões é necessário `insecure = true`
# aqui e/ou a flag --insecure no flower-superlink/flower-supernode.
[tool.flwr.federations.raspberry-deployment]
address = "172.28.254.64:9093"
insecure = true